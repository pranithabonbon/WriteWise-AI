services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: development
      FLASK_DEBUG: "0"
      PORT: "5001"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "5001:5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_NAME: WriteWise AI
        VITE_MAX_UPLOAD_MB: "5"
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
